import java.util.Properties

plugins {
    id 'com.android.application'
}

def localProperties = new Properties()

localProperties.load(
        new FileInputStream(
                rootProject.file("local.properties")
        )
)

android {

    namespace 'com.company.supportvisit'

    compileSdk 35

    defaultConfig {

        applicationId "com.company.supportvisit"

        minSdk 26
        targetSdk 35

        versionCode 1
        versionName "1.0"

        buildConfigField(
                "String",
                "CLIENT_ID",
                "\"${localProperties['CLIENT_ID']}\""
        )

        buildConfigField(
                "String",
                "TENANT_ID",
                "\"${localProperties['TENANT_ID']}\""
        )

        buildConfigField(
                "String",
                "SITE_ID",
                "\"${localProperties['SITE_ID']}\""
        )

        buildConfigField(
                "String",
                "LIST_ID",
                "\"${localProperties['LIST_ID']}\""
        )

        buildConfigField(
                "String",
                "REDIRECT_URI",
                "\"${localProperties['REDIRECT_URI']}\""
        )

    }

    buildTypes {

        release {

            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )
        }
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/INDEX.LIST"
            ]
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.microsoft.identity.client:msal:8.0.2'

    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    implementation 'com.github.gcacace:signature-pad:1.3.1'


}