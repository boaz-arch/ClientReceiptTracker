plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

// local.properties is optional (CI and fresh clones may not have one).
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// The Support Visit server the app talks to (sign-in, sync, email). Empty = not configured.
def defaultServerUrl = localProperties.getProperty("SUPPORT_SERVER_URL", System.getenv("SUPPORT_SERVER_URL") ?: "")

// Release signing: keystore.properties (never committed) or environment variables (CI).
// Without them the release build is unsigned, which is fine for checking that it compiles.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String env -> keystoreProperties.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue("storeFile", "SIGNING_STORE_FILE")
def hasReleaseSigning = releaseStoreFile && rootProject.file(releaseStoreFile).exists()

// Version: passed by the release workflow from the git tag (v1.2.3 -> 1.2.3 / 10203).
def appVersionName = (findProperty("versionName") ?: "1.0").toString()
def appVersionCode = (findProperty("versionCode") ?: "1").toString().toInteger()

android {

    namespace 'com.company.supportvisit'

    compileSdk 37

    defaultConfig {

        applicationId "com.company.supportvisit"

        minSdk 26
        targetSdk 35

        versionCode appVersionCode
        versionName appVersionName

        buildConfigField("String", "DEFAULT_SERVER_URL", "\"$defaultServerUrl\"")

        // Plan limits (Free vs Pro). Off until pricing is decided: build with -PenforcePlans=true to turn on.
        buildConfigField("boolean", "ENFORCE_PLANS", (findProperty("enforcePlans") ?: "false").toString())

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue("storePassword", "SIGNING_STORE_PASSWORD")
                keyAlias signingValue("keyAlias", "SIGNING_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {

        debug {
            // Same applicationId as release on purpose: phones already running a debug build keep their data.
            versionNameSuffix "-debug"
        }

        release {

            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ksp {
    // Room schema history, committed so future versions can write tested migrations.
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Optional app lock (fingerprint / face / screen lock).
    implementation 'androidx.biometric:biometric:1.1.0'

    // Charts for the dashboard (Maven Central, Material theming, maintained).
    implementation 'com.patrykandpatrick.vico:views:2.5.2'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    implementation 'androidx.work:work-runtime-ktx:2.11.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.github.gcacace:signature-pad:1.3.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json implementation for JVM unit tests (android.jar only ships stubs).
    testImplementation 'org.json:json:20240303'
}
