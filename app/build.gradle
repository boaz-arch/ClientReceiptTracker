import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

// local.properties is optional (CI and fresh clones may not have one).
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// msal_config.json is not committed (it holds the app registration IDs).
// Copy msal_config.example.json to app/src/main/res/raw/msal_config.json and fill it in.
def msalConfigFile = file("src/main/res/raw/msal_config.json")

// The BrowserTabActivity redirect path in the manifest must match the signature hash in
// msal_config.json's redirect_uri. Read it from there so there is a single source of truth;
// MSAL_SIGNATURE_HASH in local.properties overrides it.
def msalSignatureHash = localProperties.getProperty("MSAL_SIGNATURE_HASH", "")
def msalClientId = ""
if (msalConfigFile.exists()) {
    def msalConfig = new JsonSlurper().parse(msalConfigFile)
    msalClientId = msalConfig.client_id?.toString() ?: ""
    if (msalSignatureHash.isEmpty()) {
        def redirectUri = msalConfig.redirect_uri?.toString() ?: ""
        msalSignatureHash = URLDecoder.decode(
                redirectUri.substring(redirectUri.lastIndexOf('/') + 1), "UTF-8"
        )
    }
}

// Scope of the Support Visit server API ("Expose an API" in the app registration).
def apiScope = localProperties.getProperty("API_SCOPE", msalClientId ? "api://$msalClientId/access_as_user" : "")
// Default server URL; an admin can change it in Settings. Empty = not configured.
def defaultServerUrl = localProperties.getProperty("SUPPORT_SERVER_URL", System.getenv("SUPPORT_SERVER_URL") ?: "")

android {

    namespace 'com.company.supportvisit'

    compileSdk 37

    defaultConfig {

        applicationId "com.company.supportvisit"

        minSdk 26
        targetSdk 35

        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [msalSignatureHash: msalSignatureHash]

        buildConfigField("String", "API_SCOPE", "\"$apiScope\"")
        buildConfigField("String", "DEFAULT_SERVER_URL", "\"$defaultServerUrl\"")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {

        release {

            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ksp {
    // Room schema history, committed so future versions can write tested migrations.
    arg("room.schemaLocation", "$projectDir/schemas")
}

def checkMsalConfig = tasks.register("checkMsalConfig") {
    def config = msalConfigFile
    doLast {
        if (!config.exists()) {
            throw new GradleException(
                    "Missing app/src/main/res/raw/msal_config.json. " +
                    "Copy msal_config.example.json there and fill in your Azure app registration " +
                    "(see README.md > Microsoft sign-in setup)."
            )
        }
    }
}

tasks.named("preBuild") { dependsOn(checkMsalConfig) }

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Optional app lock (fingerprint / face / screen lock).
    implementation 'androidx.biometric:biometric:1.1.0'

    // Charts for the dashboard (Maven Central, Material theming, maintained).
    implementation 'com.patrykandpatrick.vico:views:2.5.2'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    implementation 'androidx.work:work-runtime-ktx:2.11.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.microsoft.identity.client:msal:8.0.2'

    implementation 'com.github.gcacace:signature-pad:1.3.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json implementation for JVM unit tests (android.jar only ships stubs).
    testImplementation 'org.json:json:20240303'
}
